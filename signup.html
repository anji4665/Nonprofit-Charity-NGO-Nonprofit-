<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stackly — Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<style>
/* =========================================================
   STACKLY — NGO / NONPROFIT SIGN UP
   Internal CSS (theme matched to reference screenshots)
   ========================================================= */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root{
  --teal:        #1aa189;
  --teal-dark:   #0e8b76;
  --teal-light:  #2fd0b0;
  --panel:       #3f5f54;
  --white:       #ffffff;
}

html{
  background: var(--panel);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body{
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;

  /* ---------- BACKGROUND IMAGE + TEAL FILTER ----------
     >>> 
 */
  background-image:
    linear-gradient(100deg,
        rgba(63,95,84,1)    0%,
        rgba(63,95,84,1)    38%,
        rgba(63,95,84,.88)  50%,
        rgba(63,95,84,.45)  66%,
        rgba(63,95,84,.12)  82%,
        rgba(63,95,84,.05) 100%),
    url("./images/background.webp");
  background-size: 100% 100%, cover;
  background-position: center, center right;
  background-repeat: no-repeat, no-repeat;
}

/* =========================================================
   LAYOUT
   ========================================================= */
.page{
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 48px 7vw;
}

.form-side{
  width: 100%;
  max-width: 510px;
}

/* ---------- BACK TO HOME ---------- */
.back-home{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 22px;
  padding: 9px 18px;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 6px;
  background: rgba(255,255,255,.10);
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: background .2s ease, transform .2s ease, border-color .2s ease;
}
.back-home:hover{
  background: rgba(255,255,255,.20);
  border-color: #fff;
  transform: translateY(-2px);
}

/* ---------- HEADINGS ---------- */
.title{
  font-size: clamp(30px, 4vw, 48px);
  font-weight: 800;
  letter-spacing: -.5px;
  line-height: 1.08;
  margin-bottom: 14px;
}

.subtitle{
  font-size: clamp(11.5px, 1.05vw, 15px);
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: 400;
  opacity: .95;
  margin-bottom: 42px;
}

/* ---------- FIELDS ---------- */
.field{ margin-bottom: 22px; }

.field label{
  display: block;
  font-size: 14px;
  font-weight: 400;
  color: #eef4f1;
  margin-bottom: 10px;
}

.field input{
  width: 100%;
  height: 48px;
  border: none;
  outline: none;
  border-radius: 6px;
  padding: 0 16px;
  font-size: 14px;
  font-family: inherit;
  color: #2c3e37;
  background: #fff;
  transition: box-shadow .2s ease;
}
.field input::placeholder{ color: #b6bfbb; }
.field input:focus{ box-shadow: 0 0 0 3px rgba(26,161,137,.45); }

/* password eye */
.pwd-wrap{ position: relative; }
.pwd-wrap input{ padding-right: 46px; }
.toggle-eye{
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: #9aa8a2;
  cursor: pointer;
  transition: color .2s;
}
.toggle-eye:hover{ color: var(--teal); }

/* ---------- PASSWORD STRENGTH ---------- */
.strength{
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.strength-bar{
  flex: 1;
  height: 4px;
  border-radius: 99px;
  background: rgba(255,255,255,.28);
  transition: background .25s ease;
}
.strength-bar.active.weak  { background: #e74c3c; }
.strength-bar.active.medium{ background: #f1c40f; }
.strength-bar.active.strong{ background: #2ecc71; }

/* ---------- ROLE BOXES ---------- */
.role-boxes{
  display: flex;
  gap: 22px;
}
.role-box{
  flex: 1;
  height: 48px;
  border: 2px solid transparent;
  border-radius: 6px;
  background: #fff;
  color: #a9b3af;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  transition: all .2s ease;
}
.role-box:hover{ color: #7d8985; }
.role-box.active{
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 600;
  box-shadow: 0 0 0 3px rgba(26,161,137,.18);
}

/* ---------- PRIMARY BUTTON ---------- */
.actions{
  display: flex;
  justify-content: center;
  margin-top: 30px;
}
.btn-primary{
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 152px;
  height: 48px;
  padding: 0 42px;
  border: none;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 10px 22px rgba(0,0,0,.22);
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.btn-primary:hover{
  transform: translateY(-2px);
  box-shadow: 0 14px 26px rgba(0,0,0,.30);
}
.btn-primary:active{ transform: translateY(0); }
.btn-primary.loading{ pointer-events: none; filter: brightness(.95); }

.btn-primary .spinner{
  display: none;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
.btn-primary.loading .btn-text{ display: none; }
.btn-primary.loading .spinner { display: block; }
@keyframes spin{ to{ transform: rotate(360deg); } }

/* ---------- OR DIVIDER ---------- */
.divider{
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 26px 0 20px;
}
.divider::before,
.divider::after{
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,.45);
}
.divider span{
  font-size: 12px;
  letter-spacing: 1.5px;
  color: #fff;
}

/* ---------- SOCIAL BUTTONS ---------- */
.socials{
  display: flex;
  justify-content: center;
  gap: 16px;
}
.social-btn{
  width: 62px;
  height: 48px;
  border: none;
  border-radius: 8px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0,0,0,.16);
  transition: transform .2s ease, box-shadow .2s ease;
}
.social-btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(0,0,0,.22);
}
.social-btn .fa-google    { color: #ea4335; }
.social-btn .fa-facebook-f{ color: #1877f2; }
.social-btn .fa-apple     { color: #111111; }

/* ---------- BOTTOM SWITCH LINE ---------- */
.switch-line{
  text-align: center;
  margin-top: 24px;
  font-size: 13px;
  color: #eef4f1;
}
.switch-line a{
  color: #fff;
  font-weight: 700;
  text-decoration: underline;
}

/* =========================================================
   TOAST
   ========================================================= */
.toast{
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 10000;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  max-width: 350px;
  padding: 14px 18px;
  border-radius: 10px;
  border-left: 4px solid var(--teal);
  background: #fff;
  color: #20302b;
  box-shadow: 0 12px 32px rgba(0,0,0,.25);
  opacity: 0;
  transform: translateY(-24px);
  pointer-events: none;
  transition: opacity .35s cubic-bezier(.4,0,.2,1),
              transform .35s cubic-bezier(.4,0,.2,1);
}
.toast.show{ opacity: 1; transform: translateY(0); }
.toast.error{ border-left-color: #e74c3c; }
.toast.info { border-left-color: #3498db; }

.toast-icon{ font-size: 18px; line-height: 1.2; }
.toast-title{
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 3px;
}
.toast-msg{
  font-size: 12.5px;
  line-height: 1.45;
  color: #5b6b65;
}

/* =========================================================
   PRELOADER
   ========================================================= */
.preloader{
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  transition: opacity .5s ease, visibility .5s ease;
}
.preloader.hidden{
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.preloader-box{
  width: min(320px, 80vw);
  text-align: center;
}
.preloader-logo{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 22px;
}
.preloader-logo i{ color: var(--teal-light); }
.preloader-track{
  height: 6px;
  border-radius: 99px;
  background: rgba(255,255,255,.18);
  overflow: hidden;
}
.preloader-bar{
  width: 0%;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--teal), var(--teal-light));
  transition: width .18s linear;
}
.preloader-meta{
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
  font-size: 12px;
  letter-spacing: .6px;
  color: #d6e6e0;
}
#preloader-status.done{ color: var(--teal-light); font-weight: 600; }

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 900px){
  .page{ padding: 44px 6vw; }
  body{
    background-image:
      linear-gradient(160deg,
          rgba(63,95,84,.97)  0%,
          rgba(63,95,84,.95) 55%,
          rgba(63,95,84,.90) 100%),
      url("hands-jar.jpg");
  }
}

@media (max-width: 520px){
  .page{
    padding: 34px 20px 44px;
    align-items: flex-start;
  }
  .title{ font-size: 30px; }
  .subtitle{
    font-size: 11.5px;
    letter-spacing: 3px;
    margin-bottom: 30px;
  }
  .field{ margin-bottom: 18px; }
  .field input{ height: 46px; font-size: 13.5px; }
  .role-boxes{ gap: 14px; }
  .role-box{ height: 46px; font-size: 13.5px; }
  .actions{ margin-top: 26px; }
  .btn-primary{ min-width: 160px; height: 48px; }
  .socials{ gap: 12px; }
  .social-btn{ flex: 1; width: auto; height: 46px; }
  .switch-line{ font-size: 12.5px; }
  .toast{
    top: 14px;
    left: 14px;
    right: 14px;
    max-width: none;
  }
}
</style>
</head>

<body>



<!-- ============ PAGE ============ -->
<main class="page">
  <section class="form-side">

    <a href="index.html" class="back-home">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>

    <h1 class="title">Welcome Back</h1>
    <p class="subtitle">Register with email</p>

    <form id="signupForm" class="form" novalidate>

      <!-- NAME -->
      <div class="field">
        <label for="signupName">Name</label>
        <input type="text" id="signupName" placeholder="John Doe"
               autocomplete="name" spellcheck="false" />
      </div>

      <!-- EMAIL -->
      <div class="field">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@gmail.com"
               autocomplete="email" spellcheck="false" />
      </div>

      <!-- PASSWORD -->
      <div class="field">
        <label for="signupPassword">Password</label>
        <div class="pwd-wrap">
          <input type="password" id="signupPassword" placeholder=""
                 autocomplete="new-password" />
          <i class="fa-solid fa-eye toggle-eye"
             onclick="togglePassword('signupPassword', this)"
             aria-label="Show password"></i>
        </div>
        <div class="strength" id="signupPwdStrength">
          <span class="strength-bar"></span>
          <span class="strength-bar"></span>
          <span class="strength-bar"></span>
          <span class="strength-bar"></span>
        </div>
      </div>

      <!-- NEW PASSWORD (CONFIRM) -->
      <div class="field">
        <label for="signupConfirm">New Password</label>
        <div class="pwd-wrap">
          <input type="password" id="signupConfirm" placeholder=""
                 autocomplete="new-password" />
          <i class="fa-solid fa-eye toggle-eye"
             onclick="togglePassword('signupConfirm', this)"
             aria-label="Show password"></i>
        </div>
      </div>

      <!-- ROLE -->
      <div class="field">
        <label>Select Role</label>
        <div class="role-boxes">
          <button type="button" class="role-box active" data-role="customer">User</button>
          <button type="button" class="role-box" data-role="employee">Admin</button>
        </div>
      </div>

      <!-- REGISTER BUTTON -->
      <div class="actions">
        <button type="submit" class="btn-primary" id="registerBtn">
          <span class="btn-text">Register</span>
          <span class="spinner"></span>
        </button>
      </div>

      <!-- OR -->
      <div class="divider"><span>OR</span></div>

      <!-- SOCIALS -->
      <div class="socials">
        <button type="button" class="social-btn" data-provider="Google" aria-label="Sign up with Google">
          <i class="fa-brands fa-google"></i>
        </button>
        <button type="button" class="social-btn" data-provider="Facebook" aria-label="Sign up with Facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </button>
        <button type="button" class="social-btn" data-provider="Apple" aria-label="Sign up with Apple">
          <i class="fa-brands fa-apple"></i>
        </button>
      </div>

      <p class="switch-line">
        Already have account? <a href="login.html">Sign In</a>
      </p>

    </form>
  </section>
</main>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="toast-icon" id="toastIconEl">✅</div>
  <div class="toast-body">
    <div class="toast-title" id="toastTitle">Title</div>
    <div class="toast-msg" id="toastMsg">Message</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================
     STATE
     ===================================================== */
  let currentRole = 'customer';

  const toastEl     = document.getElementById('toast');
  const toastIconEl = document.getElementById('toastIconEl');
  const toastTitle  = document.getElementById('toastTitle');
  const toastMsg    = document.getElementById('toastMsg');
  let toastTimer;

  /* =====================================================
     UTILITIES
     ===================================================== */
  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  }

  function isGmailEmail(email) {
    return email.trim().toLowerCase().endsWith('@gmail.com');
  }

  function isStrongPassword(pwd) {
    if (!pwd || pwd.length < 8) return false;
    const hasLetter  = /[A-Za-z]/.test(pwd);
    const hasDigit   = /[0-9]/.test(pwd);
    const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/.test(pwd);
    return hasLetter && hasDigit && hasSpecial;
  }

  function sanitizeName(input) {
    input.value = input.value.replace(/[^A-Za-z\s]/g, '');
  }

  /* =====================================================
     TOAST NOTIFICATIONS
     ===================================================== */
  function showToast(type, title, msg) {
    clearTimeout(toastTimer);
    toastEl.className = 'toast ' + type;
    toastIconEl.textContent = type === 'success' ? '✅'
                            : type === 'error'   ? '❌'
                            : 'ℹ️';
    toastTitle.textContent = title;
    toastMsg.textContent   = msg;

    requestAnimationFrame(function () {
      toastEl.classList.add('show');
    });

    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 3200);
  }
  window.showToast = showToast;

  /* =====================================================
     PASSWORD TOGGLE
     ===================================================== */
  function togglePassword(inputId, iconEl) {
    const input = document.getElementById(inputId);
    if (!input) return;

    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';

    iconEl.classList.toggle('fa-eye', !isPassword);
    iconEl.classList.toggle('fa-eye-slash', isPassword);
    iconEl.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  }
  window.togglePassword = togglePassword;

  /* =====================================================
     PASSWORD STRENGTH METER
     ===================================================== */
  function updatePasswordStrength(inputId, strengthId) {
    const input = document.getElementById(inputId);
    const strengthEl = document.getElementById(strengthId);
    if (!input || !strengthEl) return;

    input.addEventListener('input', function () {
      const pwd = this.value;
      const bars = strengthEl.querySelectorAll('.strength-bar');
      let score = 0;
      if (pwd.length >= 4) score++;
      if (pwd.length >= 8) score++;
      if (/[A-Za-z]/.test(pwd) && /[0-9]/.test(pwd)) score++;
      if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/.test(pwd)) score++;

      const classes = ['', 'weak', 'weak', 'medium', 'strong'];
      bars.forEach(function (bar, i) {
        bar.classList.remove('active', 'weak', 'medium', 'strong');
        if (i < score) {
          bar.classList.add('active', classes[score]);
        }
      });
    });
  }

  /* =====================================================
     INPUT FILTERS
     ===================================================== */
  function filterNameKeypress(e) {
    const char = String.fromCharCode(e.which || e.keyCode);
    if (!/[A-Za-z\s]/.test(char)) e.preventDefault();
  }

  function setupInputFilters() {
    const nameInput = document.getElementById('signupName');
    if (nameInput) {
      nameInput.addEventListener('keypress', filterNameKeypress);
      nameInput.addEventListener('input', function () { sanitizeName(this); });
    }
  }

  /* =====================================================
     LOADING SIMULATION
     ===================================================== */
  function simulateLoading(btnId, duration) {
    duration = duration || 1200;
    const btn = document.getElementById(btnId);
    if (!btn) return Promise.resolve();

    btn.classList.add('loading');
    return new Promise(function (resolve) {
      setTimeout(function () {
        btn.classList.remove('loading');
        resolve();
      }, duration);
    });
  }

  /* =====================================================
     SIGNUP HANDLER
     ===================================================== */
  function handleSignup(event) {
    event.preventDefault();

    const nameInput    = document.getElementById('signupName');
    const emailInput   = document.getElementById('signupEmail');
    const pwdInput     = document.getElementById('signupPassword');
    const confirmInput = document.getElementById('signupConfirm');

    const name     = nameInput.value.trim();
    const email    = emailInput.value.trim();
    const password = pwdInput.value;
    const confirm  = confirmInput.value;

    /* ---- name ---- */
    if (!/^[A-Za-z\s]{2,}$/.test(name)) {
      showToast('error', 'Invalid Name',
        'Name must contain only alphabets and spaces (min 2 chars).');
      nameInput.focus();
      return;
    }

    /* ---- email ---- */
    if (!email || !isValidEmail(email)) {
      showToast('error', 'Invalid Email', 'Please enter a valid email address.');
      emailInput.focus();
      return;
    }
    if (!isGmailEmail(email)) {
      showToast('error', 'Email Restriction', 'Email must end with @gmail.com.');
      emailInput.focus();
      return;
    }

    /* ---- password ---- */
    if (!isStrongPassword(password)) {
      showToast('error', 'Weak Password',
        'Password must be 8+ chars with letters, numbers & special characters.');
      pwdInput.focus();
      return;
    }

    /* ---- confirm ---- */
    if (password !== confirm) {
      showToast('error', 'Password Mismatch', 'Passwords do not match.');
      confirmInput.focus();
      return;
    }

    /* ---- submit ---- */
    simulateLoading('registerBtn', 1400).then(function () {

      const userName = name.split(' ')[0] || 'User';

      localStorage.setItem('loggedInUserEmail', email);
      localStorage.setItem('loggedInUserName',  userName);
      localStorage.setItem('userRole',         currentRole);
      localStorage.setItem('loginMethod',      'email');

      if (currentRole === 'employee') {
        localStorage.setItem('loggedInDept',     'Admin');
        localStorage.setItem('stacklyUserEmail', email);
        localStorage.setItem('stacklyUserName',  userName);
        localStorage.setItem('stacklyStaffRole', 'Admin');
      } else {
        localStorage.setItem('loggedInDept', '');
      }

      localStorage.setItem('loginTimestamp', new Date().toISOString());

      showToast('success',
        currentRole === 'employee' ? 'Registration Submitted' : 'Account Created!',
        currentRole === 'employee'
          ? 'Thank you, ' + userName + '! Pending admin approval.'
          : 'Welcome, ' + userName + '! Please sign in.'
      );

      /* reset form */
      nameInput.value    = '';
      emailInput.value   = '';
      pwdInput.value     = '';
      confirmInput.value = '';
      pwdInput.type      = 'password';
      confirmInput.type  = 'password';

      /* redirect to login page after a short delay */
      setTimeout(function () {
        window.location.href = 'login.html';
      }, 1800);
    });
  }

  /* =====================================================
     PRELOADER
     ===================================================== */
  function initPreloader() {
    const preloader = document.getElementById('preloader');
    const bar       = document.getElementById('preloader-bar');
    const percent   = document.getElementById('preloader-percent');
    const status    = document.getElementById('preloader-status');
    if (!preloader || !bar || !percent || !status) return;

    document.body.style.overflow = 'hidden';

    const minDisplayTime = 1100;
    const maxWaitTime    = 3500;

    let progress   = 0;
    let interval;
    let isComplete = false;
    const startTime = Date.now();

    const statusMessages = [
      'Loading Stackly…',
      'Connecting securely…',
      'Preparing your account…',
      'Almost ready…'
    ];

    function hidePreloader() {
      if (isComplete) return;
      isComplete = true;
      clearInterval(interval);

      bar.style.width    = '100%';
      percent.textContent = '100%';
      status.textContent  = 'Ready ✓';
      status.classList.add('done');

      const elapsed   = Date.now() - startTime;
      const remaining = Math.max(0, minDisplayTime - elapsed);

      setTimeout(function () {
        preloader.classList.add('hidden');
        document.body.style.overflow = '';
      }, remaining + 250);
    }

    interval = setInterval(function () {
      if (progress < 60) {
        progress += Math.random() * 8 + 3;
      } else if (progress < 85) {
        progress += Math.random() * 5 + 2;
      } else if (progress < 97) {
        progress += Math.random() * 2 + 0.8;
      } else {
        progress += 1;
      }

      if (progress >= 100) {
        progress = 100;
        bar.style.width     = '100%';
        percent.textContent = '100%';
        hidePreloader();
        return;
      }

      bar.style.width     = progress + '%';
      percent.textContent = Math.floor(progress) + '%';

      const msgIndex = Math.min(Math.floor(progress / 26), statusMessages.length - 1);
      if (status.textContent !== statusMessages[msgIndex] && !status.classList.contains('done')) {
        status.textContent = statusMessages[msgIndex];
      }
    }, 160);

    if (document.readyState === 'complete') {
      setTimeout(hidePreloader, 400);
    } else {
      window.addEventListener('load', function () {
        setTimeout(hidePreloader, 400);
      });
    }

    setTimeout(hidePreloader, maxWaitTime);
  }

  /* =====================================================
     DOM READY
     ===================================================== */
  document.addEventListener('DOMContentLoaded', function () {

    initPreloader();
    setupInputFilters();
    updatePasswordStrength('signupPassword', 'signupPwdStrength');

    /* ---- role boxes ---- */
    document.querySelectorAll('.role-box').forEach(function (box) {
      box.addEventListener('click', function () {
        document.querySelectorAll('.role-box').forEach(function (b) {
          b.classList.remove('active');
        });
        box.classList.add('active');
        currentRole = box.dataset.role;
      });
    });

    /* ---- submit ---- */
    document.getElementById('signupForm')
      .addEventListener('submit', handleSignup);

    /* ---- social buttons ---- */
    document.querySelectorAll('.social-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        window.location.href = '404.html';
      });
    });
  });

  /* =====================================================
     KEYBOARD SHORTCUTS
     ===================================================== */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.key === '1') {
      e.preventDefault();
      document.querySelector('.role-box[data-role="customer"]').click();
    }
    if (e.ctrlKey && e.key === '2') {
      e.preventDefault();
      document.querySelector('.role-box[data-role="employee"]').click();
    }
  });

})();
</script>
</body>
</html>
